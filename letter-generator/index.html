        <form action="GeraCarta.php" method="POST">

            <label>Nome do Remetente:</label><br>
            <input type="text" name="remetente" class="dist" placeholder="Digite aqui" required><br><br>

            <label>Nome do Destinatário:</label><br>
            <input type="text" name="destinatario" class="dist" placeholder="Digite aqui" required><br><br>

            <label>Endereço do Remetente:</label><br>
            <input type="text" name="endereco_remetente" class="dist" placeholder="Digite aqui" required><br><br>

            <label>Endereço do Destinatário:</label><br>
            <input type="text" name="endereco_destinatario" class="dist" placeholder="Digite aqui" required><br><br>

            <label>Data:</label><br>

            <label>Assunto:</label><br>
            <input type="text" name="assunto" class="dist" placeholder="Digite aqui" required><br><br>

            <label>Conteúdo:</label><br>
            <textarea name="conteudo" rows="5" class="dist" placeholder="Digite aqui" required></textarea><br><br>

            <div class="botao-gerar">
                <button type="submit" class="botao">Gerar Carta</button>
            </div>
